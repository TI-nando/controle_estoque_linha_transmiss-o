<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque de Torres – Canteiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2321; --ink2:#55605b; --ink3:#8a948f;
  --line:#e2e5e0; --line2:#eef0ec; --side:#1f2a26; --side2:#2a3832; --sideInk:#c9d3ce;
  --acc:#e2711d; --acc2:#fff1e6; --ok:#2f8a57; --okBg:#e7f4ec; --warn:#b7791f; --warnBg:#fdf3e1;
  --bad:#c0392b; --badBg:#fbeaea; --info:#2b6cb0; --infoBg:#e8f0fa;
  --r:10px; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sideInk);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--side2);margin-bottom:10px}
.brand svg{flex:none}
.brand b{color:#fff;font-size:15px;display:block;line-height:1.2}
.brand small{color:#8fa39a;font-size:11.5px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--sideInk);text-decoration:none;font-size:13.5px;margin:1px 0}
nav a:hover{background:var(--side2);color:#fff}
nav a.on{background:var(--acc);color:#fff}
nav .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#71857c;padding:14px 10px 4px}
nav .badge{margin-left:auto;background:#ffffff22;border-radius:20px;padding:0 7px;font-size:11px}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--ink2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .sub{font-weight:400;color:var(--ink3);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{color:var(--ink2);font-size:12.5px}
.kpi .v{font-size:26px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;margin-top:2px}
.kpi .h{color:var(--ink3);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c8cdc6;background:#fafbf9}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#c9620f}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink2);font-weight:500}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
input.num{font-family:var(--mono);text-align:right;width:90px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 160px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-weight:600;background:#fafbf9;position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr:hover td{background:#fbfcfa}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
.tw table th:first-child,.tw table td:first-child{position:sticky;left:0;background:inherit}
.tw td:first-child{background:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:500;background:var(--line2);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--okBg);color:var(--ok)}.tag.warn{background:var(--warnBg);color:var(--warn)}
.tag.bad{background:var(--badBg);color:var(--bad)}.tag.info{background:var(--infoBg);color:var(--info)}
.tag.acc{background:var(--acc2);color:#a24f0f}
.muted{color:var(--ink3)}.small{font-size:12.5px}.mono{font-family:var(--mono)}
.zero{color:#c3c9c5}.neg{color:var(--bad);font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.bar{height:6px;background:var(--line2);border-radius:6px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warnBg);color:#7a5210}.banner.bad{background:var(--badBg);color:#8a2a1f}.banner.info{background:var(--infoBg);color:#1f4f80}
.modalbg{position:fixed;inset:0;background:#1d232166;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;width:min(760px,100%);box-shadow:0 20px 50px #0003}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-size:16px}
.modal .body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.errs{background:var(--badBg);color:#8a2a1f;border-radius:8px;padding:10px 14px;font-size:13px}
.errs ul{margin:4px 0 0;padding-left:18px}
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--side);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 8px 24px #0003;max-width:380px;font-size:13px}
.toast.bad{background:var(--bad)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow .arrow{color:var(--acc);font-weight:700}
.sugg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.big{font-size:30px;font-weight:600;font-family:var(--mono)}
.hamb{display:none}
.statusdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok)}
.statusdot.off{background:var(--warn)}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:-260px;width:240px;z-index:40;transition:left .2s}
  aside.open{left:0}
  .hamb{display:inline-flex}
  main{padding:16px}
}

/* mapa das torres */
.seg{display:flex;gap:4px}
.mt-leg{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.mt-legi{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.mt-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2b6cb0;border:1.5px solid #fff;box-shadow:0 0 0 1px #2b6cb0}
.mt-bar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line2);margin:-4px 0 12px;gap:2px}
.mt-bar i{display:block;height:100%}
.mt-grid{display:flex;flex-wrap:wrap;gap:4px 2px;align-items:flex-end}
.mt-tile{width:54px;padding:4px 0 3px;border-radius:7px;text-align:center;cursor:pointer;border:1px solid transparent;background:linear-gradient(to top,transparent 31px,#dfe3dc 31px,#dfe3dc 32px,transparent 32px)}
.mt-tile:hover,.mt-tile:focus{border-color:#c8cdc6;background-color:#fafbf9;outline:none}
.mt-tile:focus-visible{outline:2px solid var(--acc)}
.mt-fig{position:relative;height:86px;display:flex;align-items:flex-end;justify-content:center}
.mt-num{font-family:var(--mono);font-size:10px;color:var(--ink2);line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-sub{font-size:9.5px;line-height:1.2;font-weight:600}
.mt-pronta .mt-sub{color:#2f8a57}.mt-incompleta .mt-sub{color:#c0392b}.mt-montada .mt-sub{color:#55605b;font-weight:500}
.mt-incompleta{background-color:#fdf6f5;border:1px dashed #e3a49c}
.mt-pronta{border:1px solid transparent}
.mt-sw{display:inline-block;width:14px;height:14px;border-radius:3px}
.mt-leg-incompleta .mt-sw{outline:1px dashed #c0392b;outline-offset:2px}
.mt-figs{display:flex;flex-wrap:wrap;gap:22px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.mt-figi{display:inline-flex;align-items:flex-end;gap:8px;font-size:12px;line-height:1.35}

/* prioridade de tramos */
.pr-strip{display:flex;flex-wrap:wrap;gap:2px}
.pr-cel{width:9px;height:20px;border-radius:2px;cursor:pointer;box-sizing:border-box}
.pr-cel:hover{outline:2px solid var(--ink);outline-offset:1px}
.pr-in{box-shadow:inset 0 4px 0 0 var(--acc)}
.pr-linha .mt-tile{width:44px}.pr-linha .mt-fig{height:64px}
.pr-sel{outline:2px solid var(--acc);outline-offset:-1px;background-color:var(--acc2)!important}
.pr-sel2{background-color:#fff6ee!important}
.mt-transf .mt-sub{color:#2b6cb0}
.pr-strip{align-items:flex-end}
.pr-card{border-left:4px solid var(--acc)}
.pr-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.pr-ord{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.pr-nome{font-size:16px;font-weight:600;border:1px solid transparent;padding:2px 6px;margin-left:-6px;width:100%;background:transparent}
.pr-nome:hover,.pr-nome:focus{border-color:var(--line);background:#fff}
.pr-kpis{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.pr-h3{font-size:13.5px;margin:0 0 8px}

/* torres separadas por tramo */
.tr-wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.tr-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 8px;max-width:100%}
.tr-h{font-size:14px}.tr-h .mono{font-size:12px;color:var(--ink2);margin-left:4px}
.tr-s{font-size:11.5px;color:var(--ink3);margin:2px 0 6px;max-width:520px}

/* ===== refinamento visual: tipografia mais escura, alinhamentos e transições suaves ===== */
:root{
  --ink:#111614; --ink2:#2f3935; --ink3:#56615c; --line:#dcdfd9; --line2:#ebede8;
  --ease:cubic-bezier(.2,.7,.2,1); --t:.18s;
  --shadow1:0 1px 2px #1116140d,0 1px 1px #1116140a; --shadow2:0 6px 18px #1116141a,0 2px 4px #1116140f;
}
body{color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.top{align-items:center}
.top h1{font-size:23px;font-weight:700;color:var(--ink)}
.top p{color:var(--ink2);max-width:920px}
.card{box-shadow:var(--shadow1);transition:box-shadow var(--t) var(--ease),border-color var(--t) var(--ease);padding:18px}
.card:hover{box-shadow:var(--shadow2)}
.card h2{font-size:15.5px;font-weight:650;color:var(--ink);align-items:baseline;flex-wrap:wrap;row-gap:2px}
.card h2 .sub{color:var(--ink3)}
.kpi{box-shadow:var(--shadow1);transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease);display:flex;flex-direction:column;justify-content:space-between;min-height:104px}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.kpi .l{color:var(--ink2);font-weight:550;font-size:12.5px;text-transform:none}
.kpi .v{color:var(--ink);line-height:1.15;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .h{color:var(--ink3);font-size:12px;line-height:1.35}
.field label{color:var(--ink);font-weight:550}
.muted{color:var(--ink3)}
.zero{color:#a9b1ac}
th{color:var(--ink2);font-weight:650;background:#f6f7f4;border-bottom:1px solid var(--line)}
td{color:var(--ink)}
td.n,th.n,td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr td{transition:background-color .12s ease}
tr:hover td{background:#f7f8f5}
.tw td:first-child{background:inherit}
.tw tr td:first-child{background:#fff}.tw tr:hover td:first-child{background:#f7f8f5}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters>.field{flex:0 1 220px}
input,select,textarea{min-height:36px;border-color:var(--line);transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease),background-color var(--t) var(--ease)}
input[type=checkbox],input[type=radio]{min-height:0;accent-color:var(--acc)}
input:hover,select:hover,textarea:hover{border-color:#c4c9c2}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #e2711d26}
.btn{min-height:36px;justify-content:center;font-weight:550;color:var(--ink);transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform .08s ease}
.btn:hover{box-shadow:var(--shadow1)}
.btn:active{transform:translateY(1px)}
.btn.pri{color:#fff;box-shadow:0 1px 2px #e2711d40}
.btn.pri:hover{box-shadow:0 4px 12px #e2711d40}
.btn.sm{min-height:28px}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tag{transition:background-color var(--t) var(--ease);font-weight:550}
.banner{border:1px solid transparent;line-height:1.5}
.banner.info{border-color:#cfe0f3}.banner.warn{border-color:#f2dfb8}.banner.bad{border-color:#f1cdca}
a{color:#1f5f9e;text-decoration-thickness:1px;text-underline-offset:2px;transition:color var(--t) var(--ease)}
a:hover{color:var(--acc)}
nav a{transition:background-color var(--t) var(--ease),color var(--t) var(--ease),padding-left var(--t) var(--ease)}
nav a:hover{padding-left:13px}
nav a.on{box-shadow:0 2px 8px #0000002e;font-weight:600}
nav a.on:hover{padding-left:10px}
.bar i{transition:width .6s var(--ease)}
.mt-tile{transition:transform .14s var(--ease),background-color var(--t) var(--ease),border-color var(--t) var(--ease)}
.mt-tile:hover{transform:translateY(-3px)}
details>summary{cursor:pointer;transition:color var(--t) var(--ease)}
details>summary:hover{color:var(--acc)}
details[open]>*:not(summary){animation:fadeUp .22s var(--ease) both}

/* entrada da tela, modal e avisos */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.v-enter>*{animation:fadeUp .32s var(--ease) both}
.v-enter>*:nth-child(2){animation-delay:.03s}.v-enter>*:nth-child(3){animation-delay:.06s}.v-enter>*:nth-child(4){animation-delay:.09s}
.v-enter>*:nth-child(5){animation-delay:.12s}.v-enter>*:nth-child(n+6){animation-delay:.15s}
.v-enter .kpi{animation:fadeUp .36s var(--ease) both}
.v-enter .kpi:nth-child(2){animation-delay:.05s}.v-enter .kpi:nth-child(3){animation-delay:.1s}.v-enter .kpi:nth-child(4){animation-delay:.15s}.v-enter .kpi:nth-child(5){animation-delay:.2s}
.modalbg{animation:fadeIn .18s ease both;backdrop-filter:blur(2px)}
.modal{animation:popIn .24s var(--ease) both;box-shadow:0 24px 60px #11161433}
.modal header h3{font-weight:650}
.toast{animation:slideIn .25s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
th.n,th.num{font-family:inherit}
.tw tr th:first-child{background:#f6f7f4}

/* torres completas por canteiro */
.cp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px;margin-bottom:16px}
.cp-card{margin-bottom:0}
.cp-row{display:grid;grid-template-columns:44px minmax(120px,1.4fr) repeat(4,minmax(56px,.6fr)) minmax(90px,1fr);align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line2);border-radius:8px;transition:background-color var(--t) var(--ease)}
.cp-row:last-child{border-bottom:0}
.cp-row:hover{background:#f7f8f5}
.cp-fig{display:flex;align-items:flex-end;justify-content:center;height:52px}
.cp-tipo{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.cp-tipo b{font-size:14.5px}
.cp-tipo span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-num{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.cp-num span{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3)}
.cp-num b{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.cp-num.ok b{color:var(--ok)}
.cp-bar{display:flex;align-items:center;gap:6px}
.cp-bar .bar{flex:1;min-width:40px}
.cp-bar small{font-family:var(--mono);font-size:11px;color:var(--ink2);width:34px;text-align:right}
@media(max-width:640px){
  .cp-grid{grid-template-columns:1fr}
  .cp-row{grid-template-columns:40px 1fr repeat(2,minmax(52px,auto));row-gap:6px}
  .cp-row .cp-num:nth-of-type(3),.cp-row .cp-num:nth-of-type(6){display:none}
  .cp-bar{grid-column:2/-1}
}
@media(max-width:860px){
  .top{align-items:flex-start}.top h1{font-size:20px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{min-height:0;padding:12px}.kpi .v{font-size:22px}
  .card{padding:14px}
  .filters>.field{flex:1 1 160px}
  .modalbg{padding:12px 8px}
  th,td{padding:7px 8px}
}
.cp-row{grid-template-columns:44px minmax(170px,1.8fr) repeat(4,minmax(54px,.55fr)) minmax(90px,1fr)}
.cp-tipo span{white-space:normal;overflow:visible;display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:2px}
.cp-tipo em{font-style:normal;font-size:11px;padding:0 7px}
@media(max-width:640px){.cp-row{grid-template-columns:40px 1fr repeat(2,minmax(52px,auto))}}
.cp-row{grid-template-columns:44px minmax(0,1fr) repeat(4,62px);gap:8px}
.cp-row>*{min-width:0}
.cp-tipo .cp-bar{margin-top:5px;max-width:220px}
@media(max-width:640px){.cp-row{grid-template-columns:40px minmax(0,1fr) repeat(2,62px)}.cp-bar{grid-column:auto}}
/* controles sugeridos de NFs */
.cz-al{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cz-ali{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease),transform .12s var(--ease)}
.cz-ali:hover{box-shadow:var(--shadow2);transform:translateY(-1px)}
.cz-ali b{grid-row:1/3;font-family:var(--mono);font-size:22px;min-width:38px;text-align:center;color:var(--bad)}
.cz-ali span{font-size:12.5px;line-height:1.3;color:var(--ink)}
.cz-ali small{font-size:11.5px;color:var(--ink3)}
.cz-ali.zero b{color:var(--ok)}.cz-ali.zero{opacity:.7}
.cz-ali.on{border-color:var(--acc);box-shadow:0 0 0 3px #e2711d26}
th .small{text-transform:none;font-weight:450;letter-spacing:0;color:var(--ink3)}
/* toneladas por fornecedor e canteiro: painéis divididos, sem rolagem */
.tf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.tf-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;transition:box-shadow var(--t) var(--ease)}
.tf-box:hover{box-shadow:var(--shadow2)}
.tf-h{padding:10px 14px;font-weight:700;font-size:14px;background:#f6f7f4;border-bottom:1px solid var(--line)}
.tf-row{display:grid;grid-template-columns:minmax(80px,1.1fr) repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line2)}
.tf-row:last-child{border-bottom:0}
.tf-row>div{padding:9px 12px;border-left:1px solid var(--line2);min-width:0}
.tf-row>div:first-child{border-left:0}
.tf-row.tot{background:#fafbf9;border-top:1px solid var(--line)}
.tf-row.tot .tf-c{font-weight:700}
.tf-c{display:flex;align-items:center;font-weight:550}
.tf-n{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.tf-n span{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3)}
.tf-n b{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tf-n.bad b{color:var(--bad)}
@media(max-width:480px){.tf-grid{grid-template-columns:1fr}.tf-row{grid-template-columns:repeat(4,minmax(0,1fr))}.tf-row .tf-c{grid-column:1/-1;border-bottom:1px solid var(--line2);background:#fcfcfb}.tf-row>div:nth-child(2){border-left:0}}
.tf-grid{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}@media(max-width:480px){.tf-grid{grid-template-columns:1fr}}
/* tabelas divididas por linhas, sem caixa de rolagem; no celular cada linha vira um bloco flexível */
.tw-flat{overflow:visible;max-height:none}
.tw-flat table th{position:static}
table.tab-linhas{border-collapse:collapse;width:100%}
table.tab-linhas th,table.tab-linhas td{border:1px solid var(--line2);vertical-align:top}
table.tab-linhas thead th{border-color:var(--line);vertical-align:bottom}
table.tab-linhas tr td:first-child,table.tab-linhas tr th:first-child{position:static}
table.tab-linhas tbody tr:nth-child(even) td{background:#fbfbfa}
table.tab-linhas tbody tr:hover td{background:#f4f6f2}
@media(max-width:760px){
  .tw-flat{border:0}
  table.tab-linhas,table.tab-linhas tbody{display:block}
  table.tab-linhas thead{display:none}
  table.tab-linhas tbody tr{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:#fff}
  table.tab-linhas tbody tr td{display:flex;flex-direction:column;gap:2px;flex:1 1 45%;min-width:0;border:0;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);background:#fff!important;text-align:left!important;white-space:normal}
  table.tab-linhas tbody tr td::before{content:attr(data-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);font-family:var(--sans,inherit)}
  table.tab-linhas tbody tr td:empty{display:none}
}
@media(max-width:760px){
  table.tab-linhas tbody tr td{display:block}
  table.tab-linhas tbody tr td::before{display:block;margin-bottom:2px}
}

/* ===== polimento geral: conteúdo centralizado, textos justificados, alinhamentos e botões com sombra ===== */
main{display:flex;flex-direction:column;align-items:center}
main>*{width:100%;max-width:1360px}
#view{width:100%;max-width:1360px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.top>div:first-child{flex:1 1 520px;min-width:0}
.top p{text-align:justify;text-justify:inter-word;hyphens:auto;max-width:none;margin:6px 0 0;line-height:1.55}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.card>p,.card .small:not(td):not(span):not(label),.banner,.empty{text-align:justify;text-justify:inter-word;hyphens:auto}
.card h2{display:flex;align-items:baseline;gap:8px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.card h2 .sub{font-weight:450}
.kpis{align-items:stretch}
.kpi{text-align:left}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 180px}
.field label{display:block;margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.empty{text-align:center!important}

/* botões: sombra, elevação e transição suave */
.btn{border-radius:9px;box-shadow:0 1px 2px #1116140f,0 1px 3px #11161414;transition:transform .16s var(--ease),box-shadow .2s var(--ease),background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px #1116141f,0 2px 4px #11161414}
.btn:active:not(:disabled){transform:translateY(0) scale(.98);box-shadow:0 1px 2px #1116141a}
.btn.pri{box-shadow:0 2px 6px #e2711d40,0 1px 2px #e2711d33}
.btn.pri:hover:not(:disabled){box-shadow:0 8px 18px #e2711d4d,0 2px 4px #e2711d33}
.btn.danger{box-shadow:0 2px 6px #c0392b33}
.btn.danger:hover:not(:disabled){box-shadow:0 8px 18px #c0392b40}
.btn.ghost{box-shadow:none}
.btn:disabled{box-shadow:none;cursor:not-allowed;opacity:.55}
.btn.sm{border-radius:7px}
label.btn{cursor:pointer}
.seg .btn{min-width:150px}

/* cartões e listas: animação suave */
.card{transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.kpi{transition:transform .22s var(--ease),box-shadow .22s var(--ease)}
.tag{transition:transform .15s var(--ease)}
tr:hover .tag{transform:translateY(-1px)}
.v-enter .card{animation:fadeUp .4s var(--ease) both}
.v-enter .card:nth-of-type(2){animation-delay:.05s}.v-enter .card:nth-of-type(3){animation-delay:.1s}.v-enter .card:nth-of-type(n+4){animation-delay:.14s}
nav a svg{transition:transform .2s var(--ease)}
nav a:hover svg{transform:scale(1.12)}
@media(max-width:860px){.top p{text-align:left}.seg .btn{min-width:0;flex:1 1 auto}}
@media(max-width:860px){.banner,.card>p,.card .small:not(td):not(span):not(label){text-align:left;hyphens:manual}}
/* resumo por nota (controle de NFs) */
.nr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.nr-box{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:12px 14px;background:#fff;cursor:pointer;box-shadow:var(--shadow1);transition:transform .16s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
.nr-box:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.nr-box span{font-size:12.5px;font-weight:600;color:var(--ink2)}
.nr-box b{font-family:var(--mono);font-size:26px;line-height:1.1;color:var(--ink)}
.nr-box small{font-size:11.5px;color:var(--ink3)}
.nr-box.ok{border-left-color:var(--ok)}.nr-box.ok b{color:var(--ok)}
.nr-box.warn{border-left-color:#d4a017}.nr-box.bad{border-left-color:var(--bad)}.nr-box.bad b{color:var(--bad)}
.nr-box.info{border-left-color:#2a78d6}.nr-box.info b{color:#2a78d6}.nr-box.neu{border-left-color:var(--line);cursor:default}
.nr-box.on{box-shadow:0 0 0 3px #e2711d33;border-color:var(--acc)}
.nr-faltas{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.nr-faltas details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff}
.nr-forn{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.nr-fh{margin-bottom:6px}
.nr-chips{display:flex;flex-wrap:wrap;gap:6px}
.nr-chip{display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:#fafbf9;font-family:var(--mono);transition:background-color .15s,transform .15s}
.nr-chip:hover{background:#fff3e8;transform:translateY(-1px)}
.nr-chip small{color:var(--ink3);font-family:inherit;font-size:11px}
.nr-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}@media(max-width:560px){.nr-grid{grid-template-columns:1fr 1fr}}

%20y1%3D%2235.2%22%20x2%3D%2226.9%22%20y2%3D%2229.2%22/%3E%3Cline%20x1%3D%225.5%22%20y1%3D%2224.6%22%20x2%3D%228.0%22%20y2%3D%2218.6%22/%3E%3Cline%20x1%3D%2231.0%22%20y1%3D%2224.6%22%20x2%3D%2228.5%22%20y2%3D%2218.6%22/%3E%3Cline%20x1%3D%221.0%22%20y1%3D%2214.0%22%20x2%3D%2235.5%22%20y2%3D%2214.0%22/%3E%3Cline%20x1%3D%221.0%22%20y1%3D%2214.0%22%20x2%3D%225.0%22%20y2%3D%229.0%22/%3E%3Cline%20x1%3D%2235.5%22%20y1%3D%2214.0%22%20x2%3D%2231.5%22%20y2%3D%229.0%22/%3E%3Cline%20x1%3D%225.0%22%20y1%3D%229.0%22%20x2%3D%2231.5%22%20y2%3D%229.0%22/%3E%3Cline%20x1%3D%221.0%22%20y1%3D%2214.0%22%20x2%3D%221.0%22%20y2%3D%2217.0%22/%3E%3Cline%20x1%3D%2235.5%22%20y1%3D%2214.0%22%20x2%3D%2235.5%22%20y2%3D%2217.0%22/%3E%3Cline%20x1%3D%2218.2%22%20y1%3D%2214.0%22%20x2%3D%2218.2%22%20y2%3D%2217.0%22/%3E%3Cline%20x1%3D%229.0%22%20y1%3D%2230.0%22%20x2%3D%220.5%22%20y2%3D%2299.0%22/%3E%3Cline%20x1%3D%2227.5%22%20y1%3D%2230.0%22%20x2%3D%2236.0%22%20y2%3D%2299.0%22/%3E%3Cline%20x1%3D%229.0%22%20y1%3D%2230.0%22%20x2%3D%226.0%22%20y2%3D%2299.0%22/%3E%3Cline%20x1%3D%2227.5%22%20y1%3D%2230.0%22%20x2%3D%2230.5%22%20y2%3D%2299.0%22/%3E%3C/g%3E%3C/svg%3E")}

<script>
// ===== Núcleo de regras de negócio (puro, sem DOM) =====
// Modelo da obra:
//  tipos:   [{id, codigo, estrutura, regra:{modo:'estaiada'|'autoportante', alturaBase, modulo, stubs, fixos:[grupos]},
//             volumes:[{id, nome, grupo:'TB'|'EXT6'|'PERNA4,5'|'AP/STB'|'PINO'|'CALOTA'|'PRA'|..., pesoKg}]}]
//  torres:  [{n:'94/1', op:ordem, t:tipoId, h:altura, e:extensao, p:[A,B,C,D], c:canteiroId}]   (lista de construção)
//  movimentos: [{natureza, canteiroId, tipoId, itens:[{componenteId(=volumeId), qtd com sinal}], numeroTorre?}]
//  Saldo = soma do razão. Kit da torre = TB + extensão + pernas + stubs (+ pino/calota nas estaiadas).
var Core = (function () {
  var NATUREZAS = {
    ENTRADA: 'Recebimento', SAIDA: 'Saída / baixa', AJUSTE: 'Ajuste de inventário',
    TRANSF_SAIDA: 'Transferência (envio)', TRANSF_ENTRADA: 'Transferência (recebimento)',
    APLICACAO: 'Aplicação em torre', MONTAGEM: 'Aplicação em torre', ESTORNO: 'Estorno'
  };
  var STATUS_TRANSF = { SOLICITADA: 'Solicitada', EM_TRANSITO: 'Em trânsito', RECEBIDA: 'Recebida', CANCELADA: 'Cancelada' };

  function key(c, t, v) { return c + '|' + t + '|' + v; }
  function get(map, c, t, v) { return map.get(key(c, t, v)) || 0; }
  function fmt(x) { return String(Math.round(Number(x) * 10) / 10).replace('.', ','); }
  function grupoExt(e) { return 'EXT' + fmt(e); }
  function grupoPerna(p) { return 'PERNA' + fmt(p); }

  // ---------- saldos ----------
  function calcularSaldos(movimentos) {
    var s = new Map();
    for (var i = 0; i < movimentos.length; i++) {
      var m = movimentos[i]; if (!m || !m.itens) continue;
      for (var j = 0; j < m.itens.length; j++) {
        var it = m.itens[j], k = key(m.canteiroId, m.tipoId, it.componenteId);
        s.set(k, (s.get(k) || 0) + Number(it.qtd || 0));
      }
    }
    return s;
  }
  function somaTransf(transferencias, status, lado) {
    var r = new Map();
    transferencias.forEach(function (t) {
      if (t.status !== status) return;
      t.itens.forEach(function (it) {
        var k = key(lado === 'origem' ? t.origemId : t.destinoId, t.tipoId, it.componenteId);
        r.set(k, (r.get(k) || 0) + Number(it.qtd || 0));
      });
    });
    return r;
  }
  function calcularReservas(tr) { return somaTransf(tr, 'SOLICITADA', 'origem'); }
  function calcularTransito(tr) { return somaTransf(tr, 'EM_TRANSITO', 'destino'); }
  function calcularEntrando(tr) {
    var a = somaTransf(tr, 'SOLICITADA', 'destino'), b = somaTransf(tr, 'EM_TRANSITO', 'destino');
    b.forEach(function (q, k) { a.set(k, (a.get(k) || 0) + q); }); return a;
  }
  function disponivel(saldos, reservas, c, t, v) { return get(saldos, c, t, v) - get(reservas, c, t, v); }
  // Para planejar, saldo negativo (erro de lançamento, sinalizado nos alertas) conta como zero: não existe peça negativa.
  function estoqueDo(saldos, reservas, c, tipo) {
    var o = {};
    (tipo.volumes || []).forEach(function (v) { o[v.id] = Math.max(0, disponivel(saldos, reservas, c, tipo.id, v.id)); });
    return o;
  }
  /** Saldo físico (negativos zerados) + o que já está vindo para cada canteiro (solicitado ou em trânsito). */
  function saldosComEntrada(saldos, entrando) {
    var m = new Map();
    saldos.forEach(function (q, k) { m.set(k, Math.max(0, q)); });
    if (entrando) entrando.forEach(function (q, k) { m.set(k, (m.get(k) || 0) + q); });
    return m;
  }

  // ---------- kit de uma torre ----------
  function porGrupo(tipo) {
    if (tipo._g) return tipo._g;
    var g = {};
    (tipo.volumes || []).forEach(function (v) { (g[v.grupo] = g[v.grupo] || []).push(v); });
    Object.defineProperty(tipo, '_g', { value: g, enumerable: false });
    return g;
  }
  /** Grupos (com quantidade) que formam a torre. */
  function gruposDaTorre(tipo, torre) {
    var r = tipo.regra || { modo: 'autoportante', stubs: 4, fixos: ['TB'] };
    var out = [];
    (r.fixos || ['TB']).forEach(function (g) { out.push({ grupo: g, qtd: 1 }); });
    if (r.modo === 'estaiada') {
      var e = Math.round((Number(torre.h || 0) - Number(r.alturaBase || 0)) * 10) / 10;
      if (e > 0) {
        var mod = Number(r.modulo || 6), n = Math.floor(e / mod + 1e-9), resto = Math.round((e - n * mod) * 10) / 10;
        if (n) out.push({ grupo: grupoExt(mod), qtd: n });
        if (resto > 0) out.push({ grupo: grupoExt(resto), qtd: 1 });
      }
    } else {
      var ge = grupoExt(torre.e || 0);
      if (Number(torre.e || 0) > 0 || porGrupo(tipo)[ge]) out.push({ grupo: ge, qtd: 1, opcional: !(Number(torre.e || 0) > 0) });
      var pernas = {};
      (torre.p || []).forEach(function (p) { if (Number(p) > 0) { var g = grupoPerna(p); pernas[g] = (pernas[g] || 0) + 1; } });
      Object.keys(pernas).forEach(function (g) { out.push({ grupo: g, qtd: pernas[g] }); });
    }
    if (r.stubs) out.push({ grupo: 'AP/STB', qtd: Number(r.stubs) });
    return out;
  }
  /** {itens:{volumeId:qtd}, gruposAusentes:[...]} */
  function kitDaTorre(tipo, torre) {
    var g = porGrupo(tipo), itens = {}, ausentes = [];
    gruposDaTorre(tipo, torre).forEach(function (x) {
      var vs = g[x.grupo];
      if (!vs || !vs.length) { if (!x.opcional) ausentes.push(x.grupo); return; }
      vs.forEach(function (v) { itens[v.id] = (itens[v.id] || 0) + x.qtd; });
    });
    return { itens: itens, gruposAusentes: ausentes };
  }

  // Aplicado por torre (aplicações/montagens menos estornos delas)
  function aplicadoPorTorre(movimentos) {
    var byId = {}, ap = {};
    movimentos.forEach(function (m) { byId[m.id] = m; });
    movimentos.forEach(function (m) {
      var num = m.numeroTorre;
      if (m.natureza === 'ESTORNO' && m.estornoDe && byId[m.estornoDe]) num = byId[m.estornoDe].numeroTorre;
      if (!num) return;
      if (m.natureza !== 'APLICACAO' && m.natureza !== 'MONTAGEM' && m.natureza !== 'ESTORNO') return;
      var o = ap[num] = ap[num] || {};
      m.itens.forEach(function (it) { o[it.componenteId] = (o[it.componenteId] || 0) - Number(it.qtd); });
    });
    return ap;
  }
  /** O que ainda falta aplicar na torre. */
  function necessidade(tipo, torre, aplicado) {
    var k = kitDaTorre(tipo, torre).itens, a = (aplicado && aplicado[torre.n]) || {}, out = {};
    Object.keys(k).forEach(function (v) { var q = k[v] - (a[v] || 0); if (q > 0) out[v] = q; });
    return out;
  }
  function statusTorre(tipo, torre, aplicado) {
    var a = (aplicado && aplicado[torre.n]) || {};
    var algum = Object.keys(a).some(function (k) { return a[k] > 0; });
    var falta = necessidade(tipo, torre, aplicado);
    if (!Object.keys(falta).length) return algum ? 'montada' : 'pendente';
    if (!algum) return 'pendente';
    var stubIds = (porGrupo(tipo)['AP/STB'] || []).map(function (v) { return v.id; });
    var soStub = Object.keys(a).every(function (k) { return a[k] <= 0 || stubIds.indexOf(k) >= 0 || /PINO/.test(nomeVol(tipo, k)); });
    return soStub ? 'fundacao' : 'parcial';
  }
  function nomeVol(tipo, id) { var v = (tipo.volumes || []).find(function (x) { return x.id === id; }); return v ? v.nome : ''; }

  function cobre(estoque, need) { for (var k in need) if ((estoque[k] || 0) < need[k]) return false; return true; }
  function tirar(estoque, need) { for (var k in need) estoque[k] = (estoque[k] || 0) - need[k]; }
  function faltaContra(estoque, need) {
    var f = []; for (var k in need) { var x = need[k] - Math.max(0, estoque[k] || 0); if (x > 0) f.push({ componenteId: k, qtd: x }); } return f;
  }
  function soma(need) { var s = 0; for (var k in need) s += need[k]; return s; }

  /**
   * Para um tipo: aloca o estoque disponível de cada canteiro às torres pendentes dele, na ordem da LC.
   * Retorna {torres:{n:{status, kitDisponivel, falta[]}}, sobra:{canteiroId:{vol:qtd}}, resumo:{canteiroId:{...}}}
   */
  function alocarTipo(tipo, torresTipo, canteiros, saldos, reservas, aplicado) {
    var res = { torres: {}, sobra: {}, resumo: {} };
    canteiros.forEach(function (c) {
      var est = estoqueDo(saldos, reservas, c.id, tipo);
      var minhas = torresTipo.filter(function (t) { return t.c === c.id; }).sort(function (a, b) { return a.op - b.op; });
      var r = { projeto: minhas.length, montadas: 0, prontas: 0, incompletas: 0, fundacao: 0 };
      var pend = [];
      minhas.forEach(function (t) {
        var st = statusTorre(tipo, t, aplicado);
        if (st === 'montada') { r.montadas++; res.torres[t.n] = { status: st, kitDisponivel: true, falta: [] }; return; }
        if (st === 'fundacao') r.fundacao++;
        var need = necessidade(tipo, t, aplicado);
        if (cobre(est, need)) { tirar(est, need); r.prontas++; res.torres[t.n] = { status: st, kitDisponivel: true, falta: [] }; }
        else pend.push({ t: t, need: need, st: st });
      });
      pend.forEach(function (p) { r.incompletas++; res.torres[p.t.n] = { status: p.st, kitDisponivel: false, falta: faltaContra(est, p.need), need: p.need }; });
      res.sobra[c.id] = est; res.resumo[c.id] = r;
    });
    return res;
  }

  /**
   * Remanejamento para um tipo. Doadores só cedem a SOBRA (o que não está alocado às torres
   * que eles já conseguem montar), então nenhum canteiro perde uma torre pronta.
   * opts: {destinoId}
   */
  function sugerirRemanejamento(tipo, torresTipo, canteiros, saldos, reservas, aplicado, opts) {
    opts = opts || {};
    var ativos = canteiros.filter(function (c) { return c.ativo !== false; });
    // O que já está vindo (solicitado ou em trânsito) conta no destino: evita sugerir duas vezes a mesma peça
    saldos = saldosComEntrada(saldos, opts.entrando);
    var base = alocarTipo(tipo, torresTipo, ativos, saldos, reservas, aplicado);
    var sobra = {}; ativos.forEach(function (c) { sobra[c.id] = Object.assign({}, base.sobra[c.id]); });

// Cores categóricas validadas (ordem fixa; segue o fornecedor, não a posição na tela)
var PALETA_FORN = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6'];
function listaFornecedores() {
  var o = {};
  S.tipos.forEach(function (t) { if (t.fornecedor) o[String(t.fornecedor).trim().toUpperCase()] = 1; });
  S.nfs.forEach(function (n) { if (n.f) o[n.f] = 1; });
  return Object.keys(o).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); });
}
function corForn(f) { var l = listaFornecedores(), i = l.indexOf(f); return i >= 0 && i < PALETA_FORN.length ? PALETA_FORN[i] : '#8a948f'; }
function pesoMov(m) {
  var t = tipoById(m.tipoId); if (!t) return 0;
  var p = t._pesos; if (!p) { p = {}; (t.volumes || []).forEach(function (v) { p[v.id] = Number(v.pesoKg || 0); }); Object.defineProperty(t, '_pesos', { value: p, enumerable: false }); }
  return m.itens.reduce(function (a, i) { return a + (p[i.componenteId] || 0) * Number(i.qtd); }, 0) / 1000;
}
function conferencia() { var m = M(); if (!m.conf) m.conf = C.conferirNFs(S.nfs, S.movimentos, pesoMov); return m.conf; }
function precos() { var m = M(); if (!m.precos) m.precos = C.precoPorFornecedor(S.nfs.filter(function (n) { return !(n.origem === 'carga' && !n.v); })); return m.precos; }
function precoDoTipo(t) { var p = precos(), f = String(t.fornecedor || '').trim().toUpperCase(); return p[f] || null; }
/** Valor do estoque físico por canteiro x tipo, com quanto está "aguardando complemento" (não alocado a torre pronta). */
function valorEstoque() {
  var m = M(); if (m.valor) return m.valor;
  var out = { total: 0, ton: 0, aguardando: 0, excedente: 0, linhas: [], semPreco: [] };
  tiposOrd().forEach(function (t) {
    var preco = precoDoTipo(t), pesos = {}, a = aloc(t.id), nec = necessidadePendente(t.id);
    (t.volumes || []).forEach(function (v) { pesos[v.id] = Number(v.pesoKg || 0) / 1000; });
    if (!preco) out.semPreco.push(t.codigo);
    var necTot = {}; Object.keys(nec).forEach(function (c) { for (var k in nec[c]) necTot[k] = (necTot[k] || 0) + nec[c][k]; });
    var dispTot = {};
    cantsOrd(false).forEach(function (c) {
      var ton = 0, sob = 0, sobra = a.sobra[c.id] || {};
      (t.volumes || []).forEach(function (v) {
        var f = C.get(S.d.saldos, c.id, t.id, v.id); if (f > 0) ton += f * pesos[v.id];

        dispTot[v.id] = (dispTot[v.id] || 0) + Math.max(0, f);

function ondeAtacar(B) {
  var janela = 10, sug = [];
  var porC = {}; S.torres.forEach(function (t) { (porC[t.c] = porC[t.c] || []).push(t); });
  Object.keys(porC).forEach(function (cid) {
    var ts = porC[cid].sort(function (a, b) { return a.op - b.op; });
    for (var i = 0; i + janela <= ts.length; i++) {
      var w = ts.slice(i, i + janela), ok = 0, quase = 0, mont = 0;
      w.forEach(function (t) { var x = B.torres[t.n]; if (!x) return; if (x.situacao !== 'incompleta') { ok++; if (x.situacao === 'montada') mont++; } else if (x.falta.reduce(function (a, f) { return a + f.qtd; }, 0) <= 2) quase++; });
      sug.push({ c: cid, de: w[0].n, ate: w[w.length - 1].n, ok: ok, quase: quase, mont: mont, score: ok * 10 + quase * 4 });
    }
  });
  sug.sort(function (a, b) { return b.score - a.score; });
  var esc2 = [], usados = {};
  sug.forEach(function (s) { if (esc2.length >= 8) return; var k = s.c + Math.floor(S.torres.find(function (t) { return t.n === s.de; }).op / janela); if (usados[k]) return; usados[k] = 1; esc2.push(s); });
  return '<div class="card"><h2>Onde atacar <span class="sub">trechos de ' + janela + ' torres seguidas com mais torres prontas ou quase prontas hoje</span></h2><div class="tw"><table><thead><tr><th>Canteiro</th><th>Trecho</th><th class="n">Prontas</th><th class="n">Faltam ≤ 2 vol.</th><th></th></tr></thead><tbody>' +
    esc2.map(function (s, i) { return '<tr><td>' + esc(cantNome(s.c)) + '</td><td class="mono"><b>' + esc(s.de) + ' → ' + esc(s.ate) + '</b></td><td class="n">' + s.ok + ' / ' + janela + '</td><td class="n">' + (s.quase ? '<span class="tag warn">' + s.quase + '</span>' : '<span class="zero">0</span>') + '</td><td><button class="btn sm" data-pss="' + esc(s.de) + '|' + esc(s.ate) + '">Priorizar este trecho</button></td></tr>'; }).join('') +
    '</tbody></table></div><p class="small muted" style="margin:8px 0 0">Ponto de partida para escolher os tramos. Você também pode definir qualquer trecho no formulário acima.</p></div>';
}

async function gravarComRetry(col, id, data) {
  for (var i = 0; i < 6; i++) {
    try { return await Store.set(col, id, data); }
    catch (e) { if (e && (e.code === 'resource_exhausted' || e.code === 'unavailable') && i < 5) { await sleep(1500 * (i + 1)); continue; } throw e; }
  }
}
async function importarProjeto(D) {

  var remover = S.tipos.filter(function (t) { return !D.tipos.some(function (x) { return x.id === t.id; }) && !S.movimentos.some(function (m) { return m.tipoId === t.id; }) && !S.transferencias.some(function (x) { return x.tipoId === t.id; }); });
  var transf = D.transferencias.filter(function (t) { return !exT[t.id]; }), movs = D.movimentos.filter(function (m) { return !exM[m.id]; });
  imp.total = remover.length + D.canteiros.length + D.tipos.length + 3 + transf.length + movs.length;
  var passo = function (et) { imp.etapa = et; imp.feito++; if (imp.feito % 10 === 0 || imp.feito === imp.total) render(true); };
  var tentar = async function (et, fn) { try { await fn(); } catch (e) { imp.falhas++; console.error(et, e); } passo(et); };
  render(true);
  for (var i = 0; i < remover.length; i++) { var tr = remover[i]; await tentar('Removendo tipos modelo', function () { return Store.del('tipos', tr.id); }); }
  for (i = 0; i < D.canteiros.length; i++) {
    var c = D.canteiros[i], atual = cantById(c.id) || {};
    await tentar('Canteiros', function () { return gravarComRetry('canteiros', c.id, { nome: c.nome, sigla: c.sigla, local: c.local, trecho: c.trecho, responsavel: atual.responsavel || '', ativo: atual.ativo !== false, criadoEm: atual.criadoEm || new Date().toISOString() }); });
  }
  for (i = 0; i < D.tipos.length; i++) {

  }
  await tentar('Lista de construção', function () { return gravarComRetry('projeto', 'torres', { lista: D.torres, atualizadoEm: new Date().toISOString() }); });
  await tentar('Informações do projeto', function () { return gravarComRetry('projeto', 'info', { obra: D.obra, fontes: D.fontes, importadoEm: new Date().toISOString(), ignoradas: D.ignoradas.length }); });
  await tentar('Nome da obra', function () { return S.config.nomeObra ? Promise.resolve() : gravarComRetry('config', 'geral', { nomeObra: D.obra }); });
  for (i = 0; i < transf.length; i++) { var x = transf[i], dx = Object.assign({}, x); delete dx.id; await tentar('Transferências', function () { return gravarComRetry('transferencias', x.id, dx); }); }
  for (i = 0; i < movs.length; i++) { var mv = movs[i], dm = Object.assign({}, mv); delete dm.id; await tentar('Lançamentos do histórico', function () { return gravarComRetry('movimentos', mv.id, dm); }); }
  imp.rodando = false; imp.fim = true; imp.etapa = 'Concluído';
  render(true);
  toast(imp.falhas ? 'Importação com ' + imp.falhas + ' falha(s)' : 'Projeto importado', !!imp.falhas);

  var datas = pac.movimentos.map(function (m) { return m.data; }).filter(Boolean).sort();

}
function resumoSaldoPlano(pl) {
  var g = {}, peso = {};

  var ks = {}; Object.keys(pl.antes).concat(Object.keys(pl.depois)).forEach(function (k) { ks[k] = 1; });
  Object.keys(ks).forEach(function (k) {
    var d = (pl.depois[k] || 0) - (pl.antes[k] || 0); if (!d) return;
    var p = k.split('|'), gk = p[0] + '|' + p[1], x = g[gk] || (g[gk] = { c: p[0], t: p[1], mais: 0, menos: 0, kg: 0, vols: 0 });
    if (d > 0) x.mais += d; else x.menos -= d; x.kg += d * (peso[p[1] + '|' + p[2]] || 0); x.vols++;
  });
  return Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return a.c < b.c ? -1 : a.c > b.c ? 1 : a.t < b.t ? -1 : 1; });

  var L = [['Canteiro', 'Tipo', 'Grupo', 'Volume', 'Peso unit. (kg)', 'Saldo físico', 'Reservado', 'Disponível', 'A caminho', 'Necessário p/ torres pendentes', 'Peso físico (kg)']];
  tiposOrd().forEach(function (t) {
    var nec = necessidadePendente(t.id);
    cantsOrd(false).forEach(function (c) {

        var s = C.get(S.d.saldos, c.id, t.id, k.id), r = C.get(S.d.reservas, c.id, t.id, k.id), tr = C.get(S.d.transito, c.id, t.id, k.id), n = (nec[c.id] || {})[k.id] || 0;
        if (!s && !r && !tr && !n) return;
        L.push([c.nome, t.codigo, k.grupo, k.nome, String(k.pesoKg || '').replace('.', ','), s, r, s - r, tr, n, String(Math.round(s * (k.pesoKg || 0) * 1000) / 1000).replace('.', ',')]);
      });
    });
  });
  salvarArquivo('estoque-estruturas-' + hoje() + '.csv', csv(L));
}

      i.status === 'montada' ? '' : i.kitDisponivel ? 'Sim' : 'Não', i.falta.map(function (f) { return compNome(t.t, f.componenteId) + ' (' + f.qtd + ')'; }).join('; ')]);
  });
  salvarArquivo('torres-' + hoje() + '.csv', csv(L));
}
